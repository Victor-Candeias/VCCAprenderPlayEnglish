# PE-010: signed Android Release APK, never using the runner Debug key.
# Workflow runs only from main and requires the same keystore as VCCAprender.
name: Android Release - Signed APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vccaprendoplayenglish-signed-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    name: Sign, verify and publish Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: release

    steps:
      - name: Checkout main with all tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Verify branch and retrieve latest release tags
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "::error::A Release só pode partir da main."
            exit 1
          }
          git fetch origin --tags --force
          # A remote tag created by another actor must never be overwritten.

      - name: Calculate next version from published tags
        id: version
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p "test_release_version.py" -v
          python3 scripts/release_version.py --github-output "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --version

      - name: Require Release Secrets
        shell: bash
        env:
          VCC_RELEASE_KEYSTORE_BASE64: ${{ secrets.VCC_RELEASE_KEYSTORE_BASE64 }}
          VCC_RELEASE_STORE_PASSWORD: ${{ secrets.VCC_RELEASE_STORE_PASSWORD }}
          VCC_RELEASE_KEY_ALIAS: ${{ secrets.VCC_RELEASE_KEY_ALIAS }}
          VCC_RELEASE_KEY_PASSWORD: ${{ secrets.VCC_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in VCC_RELEASE_KEYSTORE_BASE64 VCC_RELEASE_STORE_PASSWORD VCC_RELEASE_KEY_ALIAS VCC_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Secret Release em falta: $secret_name"
              exit 1
            fi
          done

      - name: Restore private Release keystore outside workspace
        shell: bash
        env:
          VCC_RELEASE_KEYSTORE_BASE64: ${{ secrets.VCC_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          rm -f -- keystore.properties
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          encoded = os.environ["VCC_RELEASE_KEYSTORE_BASE64"]
          data = base64.b64decode("".join(encoded.split()), validate=True)
          if not data:
              raise SystemExit("Keystore Release vazia.")
          target = Path(os.environ["RUNNER_TEMP"]) / "VCCPlayEnglishRelease.p12"
          target.write_bytes(data)
          target.chmod(0o600)
          PY

      - name: Test and build signed Release
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version_name }}
          RELEASE_CODE: ${{ steps.version.outputs.version_code }}
          VCC_RELEASE_STORE_FILE: ${{ runner.temp }}/VCCPlayEnglishRelease.p12
          VCC_RELEASE_STORE_PASSWORD: ${{ secrets.VCC_RELEASE_STORE_PASSWORD }}
          VCC_RELEASE_KEY_ALIAS: ${{ secrets.VCC_RELEASE_KEY_ALIAS }}
          VCC_RELEASE_KEY_PASSWORD: ${{ secrets.VCC_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :game-plugin-sdk:testDebugUnitTest :app:testDebugUnitTest :app:assembleRelease \
            --no-daemon --max-workers=2 --no-parallel --console=plain \
            "-PappVersion=$RELEASE_VERSION" "-PbuildNumber=$RELEASE_CODE"

      - name: Verify signature, host certificate and APK version
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version_name }}
          RELEASE_CODE: ${{ steps.version.outputs.version_code }}
          EXPECTED_HOST_SHA256: ${{ vars.VCC_HOST_RELEASE_SHA256 || 'a334f539e112ef9c2fad14d47ed9762a69f6fb4165a47cefc678da47b700848b' }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk" > /dev/null
          bash scripts/compare-apk-certificates.sh \
            --expected-sha256 "$EXPECTED_HOST_SHA256" "$apk"
          package_line="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | head -n 1)"
          [[ "$package_line" == *"name='com.vcc.aprender.playenglish'"* ]] || {
            echo "::error::Package ID inválido."
            exit 1
          }
          [[ "$package_line" == *"versionName='$RELEASE_VERSION'"* ]] || {
            echo "::error::versionName do APK não corresponde à tag."
            exit 1
          }
          [[ "$package_line" == *"versionCode='$RELEASE_CODE'"* ]] || {
            echo "::error::versionCode do APK não corresponde à versão."
            exit 1
          }
          mkdir -p dist
          cp "$apk" "dist/VCCAprenderPlayEnglish-v${RELEASE_VERSION}-release.apk"
          cmp -s "$apk" "dist/VCCAprenderPlayEnglish-v${RELEASE_VERSION}-release.apk"

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VCCAprenderPlayEnglish-v${{ steps.version.outputs.version_name }}-release
          path: dist/VCCAprenderPlayEnglish-v${{ steps.version.outputs.version_name }}-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Tag version only after successful APK upload
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]] || exit 1
          git fetch origin --tags --force
          if git show-ref --tags --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "::error::A tag já existe. Não será modificada."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "VCCAprenderPlayEnglish $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Release summary
        if: success()
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version_name }}
          RELEASE_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          {
            echo "### Release v$RELEASE_VERSION"
            echo "versionCode: $RELEASE_CODE"
            echo "APK assinado e validado contra o certificado público da VCCAprender."
            echo "Artefacto: VCCAprenderPlayEnglish-v$RELEASE_VERSION-release"
            echo "A tag só foi criada depois do upload do APK."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete temporary Release keystore
        if: always()
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/VCCPlayEnglishRelease.p12"
