# PE-009: Build and test the independent Android plugin APK.
# Release signing and automatic versioning are handled separately in PE-010.
name: Android CI - Debug APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test and build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default includes the removed legacy "tools" package.
          packages: 'platform-tools'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle and cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew
          ./gradlew --version

      - name: Verify pinned VCCAprender Game Plugin SDK source
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git hash-object game-plugin-sdk/src/main/java/com/vcc/aprender/pluginsdk/GameContract.kt)
          expected="5e3f65046fd7979f09786a2a727b4e075de1592c"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::A copia do SDK nao corresponde ao commit de origem fixado."
            exit 1
          fi

      - name: Unit tests and Debug APK
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :game-plugin-sdk:testDebugUnitTest :game-plugin-sdk:assembleDebug \
            :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:assembleDebug \
            --no-daemon --max-workers=2 --no-parallel --console=plain

      - name: Verify plugin discovery metadata in generated APK
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          manifest_dump="$RUNNER_TEMP/playenglish-manifest.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml > "$manifest_dump"
          for needle in \
            "PlayEnglishPluginActivity" \
            "com.vcc.aprender.permission.PLAY_GAME" \
            "com.vcc.aprender.plugin.action.PLAY" \
            "android.intent.category.DEFAULT" \
            "com.vcc.aprender.plugin.GAME_ID" \
            "com.vcc.aprender.playenglish" \
            "com.vcc.aprender.plugin.GAME_TITLE" \
            "VCC Brincar ao Inglês" \
            "com.vcc.aprender.plugin.PROTOCOL_VERSION"; do
            if ! grep -Fq "$needle" "$manifest_dump"; then
              echo "::error::Falta um campo de descoberta do plugin no APK: $needle"
              exit 1
            fi
          done
          echo "Metadata de descoberta do plugin confirmada no APK Debug."

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VCCAprenderPlayEnglish-test-results-${{ github.run_number }}
          path: |
            game-plugin-sdk/build/test-results/testDebugUnitTest/
            game-plugin-sdk/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: VCCAprenderPlayEnglish-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: success()
        shell: bash
        run: |
          {
            echo "### VCCAprenderPlayEnglish - APK Debug"
            echo "Testes unitários e compilação concluídos com sucesso."
            echo "Descarrega o artefacto **VCCAprenderPlayEnglish-debug-${GITHUB_RUN_NUMBER}** nesta execução."
            echo "O APK declara a Activity do plugin v1; resultados reais e gestao completa de sessao serao implementados nas PE-005/006."
          } >> "${GITHUB_STEP_SUMMARY}"
